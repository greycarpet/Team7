AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Team7 tools security group in the existing landing-zone VPC. Week 2 permits
  TCP/22 from one authorized IPv4 /32 and preserves the existing outbound behavior.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: Existing foundation VPC -> tools security group -> restricted SSH
    must:
      - Evolve the existing SCRUM-13 tools security group for SCRUM-18
      - Resolve the VPC from the foundation stack before deployment
    ref:
      - at: docs/week1/SCRUM-13-security-controls.md
        has: design, account review, approval, validation, evidence, and recovery
        scope: SCRUM-13

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing Team7 VPC ID resolved from cfn-foundation-team07 outputs.

  AuthorizedSshCidr:
    Type: String
    Description: Authorized operator public IPv4 followed by /32; no broad network.
    AllowedPattern: '^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/32$'
    ConstraintDescription: Must be a valid IPv4 address with a /32 prefix.

Resources:
  Team7ToolsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Permit SSH from one authorized IPv4 /32 without replacing the existing group.
        must:
          - Permit exactly one TCP/22 IPv4 /32 rule; no other ingress
          - Omit physical GroupName; the approved name is a Name tag
          - Preserve the existing default outbound behavior
          - Never alter the existing VPC or its default security group
        mutable: review-required
    Properties:
      GroupDescription: Team7 tools security group - Week 1
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AuthorizedSshCidr
          Description: SCRUM-18 authorized operator SSH
      # GroupName is generated by CloudFormation; AWS prohibits the sg- prefix.
      # No SecurityGroupEgress property: preserve the existing group's default egress.
      Tags:
        - { Key: Name, Value: sg-tools-team07 }
        - { Key: Project, Value: Team7 }
        - { Key: Team, Value: Team7 }
        - { Key: Environment, Value: Dev }
        - { Key: Owner, Value: Team7 }
        - { Key: Workload, Value: Tools }
        - { Key: Component, Value: Security }
        - { Key: ManagedBy, Value: Team7 }
        - { Key: Repository, Value: Team7 }
        - { Key: JiraProject, Value: SCRUM }

Outputs:
  SecurityGroupId:
    Description: Generated ID of the Team7 tools security group.
    Value: !GetAtt Team7ToolsSecurityGroup.GroupId
  VpcId:
    Description: Existing VPC containing the Team7 tools security group.
    Value: !Ref VpcId
